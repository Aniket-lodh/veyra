name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go · ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [packages/queue-core, apps/api, apps/worker]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: |
            go.work.sum
            ${{ matrix.module }}/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l apps packages scripts)" || (gofmt -l apps packages scripts && exit 1)

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: Unit tests
        working-directory: ${{ matrix.module }}
        run: go test ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.6.2
          working-directory: ${{ matrix.module }}

  queue-integration:
    name: Queue integration tests (real Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: |
            go.work.sum
            packages/queue-core/go.sum

      - name: Integration tests
        working-directory: packages/queue-core
        run: go test -tags integration -count=1 ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend/app
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/frontend/app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint:check
      - run: pnpm build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build API image
        run: docker build -f deployments/docker/api.Dockerfile -t veyra-api:ci .

      - name: Build worker image
        run: docker build -f deployments/docker/worker.Dockerfile -t veyra-worker:ci .
