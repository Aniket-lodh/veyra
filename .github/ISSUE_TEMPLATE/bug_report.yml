name: Bug report
description: Something in Veyra is not behaving as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please check for an existing issue first.
        Security vulnerabilities must NOT be reported here. See SECURITY.md.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps, ideally a `curl` command or a job payload.
      placeholder: |
        1. docker compose up
        2. POST /jobs with handler "noop"
        3. ...
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - API (apps/api)
        - Worker (apps/worker)
        - Queue core (packages/queue-core)
        - Operator console (apps/frontend/app)
        - Deployment (deployments/, scripts/)
        - Docs
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit SHA or version, OS, Docker/Go/Node versions, and the compose profile if relevant.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Structured log lines from the API or worker. Redact secrets.
      render: text
