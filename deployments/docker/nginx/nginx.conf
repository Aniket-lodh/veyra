# Veyra reverse proxy — production only.
#
# Responsibilities:
#   1. Terminate HTTP/1.1 + HTTP/2 at the edge. (TLS terminates upstream of
#      this — at the VPS firewall, Caddy, or a CDN. nginx here speaks HTTP.)
#   2. Forward / to the api service, preserving headers needed for log
#      correlation (X-Request-Id) and observability (remote ip).
#   3. Hard-block /internal/* so debug routes can never be reached externally
#      even when the api accidentally mounts them.
#
# Deliberately NOT here: rate limiting, auth, websockets. Those land when
# their consumers exist.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Hop-by-hop headers the api should see in their original form. The
    # request-id middleware in apps/api honours X-Request-Id when present and
    # otherwise mints a ULID — we propagate whatever the client sent.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $http_x_request_id;

    # Bound how long we wait on a wedged api. The api's own /health probe
    # already trips at 2s of unresponsive db, so 30s here is generous.
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    upstream veyra_api {
        # The "api" hostname is resolved by docker compose's internal DNS.
        # If we ever run multiple api replicas, this becomes the load balancer.
        server api:8008;
        keepalive 32;
    }

    server {
        listen 80      default_server;
        listen [::]:80 default_server;
        server_name _;

        # Hard 404 for debug routes from the outside world. The api may
        # mount them (it does today), but they MUST NOT be reachable here.
        location /internal/ {
            return 404;
        }

        # Everything else proxies through. /health is part of this and is
        # used by uptime probes outside the compose network.
        location / {
            proxy_pass http://veyra_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
