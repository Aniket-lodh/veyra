# Production reverse proxy. Blocks /internal/*; proxies everything else to api.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $http_x_request_id;

    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    upstream veyra_api {
        server api:8008;
        keepalive 32;
    }

    server {
        listen 80      default_server;
        listen [::]:80 default_server;
        server_name _;

        location /internal/ {
            return 404;
        }

        # Operator SSE invalidation bus (ADR-0009): revisioned invalidate/resync.
        # proxy_buffering off is required so frames reach EventSource before upstream ends.
        # Long read/send timeouts match heartbeat comments (~15s) across idle periods.
        location /events {
            proxy_pass http://veyra_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            chunked_transfer_encoding off;
        }

        location / {
            proxy_pass http://veyra_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
