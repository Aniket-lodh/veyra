# OPT-IN workload fixture (unstable HTTP receiver). Dev/soak only — never with prod.

name: veyra

services:
  unstable-receiver:
    build:
      context: ../../scripts/stress/unstable-receiver
    image: veyra-unstable-receiver:local
    container_name: veyra-unstable-receiver
    restart: unless-stopped
    environment:
      RECEIVER_PORT: "8090"
      # Default mix: mostly success with a slice of 4xx/5xx. Override per run.
      RECEIVER_RATE_2XX: ${RECEIVER_RATE_2XX:-70}
      RECEIVER_RATE_4XX: ${RECEIVER_RATE_4XX:-10}
      RECEIVER_RATE_5XX: ${RECEIVER_RATE_5XX:-20}
      RECEIVER_DELAY_MS: ${RECEIVER_DELAY_MS:-0}
      RECEIVER_HANG_RATE: ${RECEIVER_HANG_RATE:-0}
      RECEIVER_HANG_MS: ${RECEIVER_HANG_MS:-60000}
    ports:
      - "127.0.0.1:8090:8090"
