# Prod overlay:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

name: veyra

services:
  postgres:
    # Loopback only — SSH tunnel for ops; never publish 0.0.0.0.
    ports: !override
      - "127.0.0.1:5433:5432"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    environment:
      APP_ENV: production
      LOG_LEVEL: info
    ports: !reset []
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    environment:
      APP_ENV: production
      LOG_LEVEL: info
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      mode: replicated
      replicas: 3

  nginx:
    image: nginx:1.27-alpine
    container_name: veyra-nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ../docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test:
        ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
