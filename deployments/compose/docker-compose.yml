# Dev stack: postgres + api + worker. Prod: add -f docker-compose.prod.yml

name: veyra

services:
  postgres:
    image: postgres:17-alpine
    container_name: veyra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-veyra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veyra}
      POSTGRES_DB: ${POSTGRES_DB:-veyra}
    ports:
      - "5433:5432"
    volumes:
      - veyra-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-veyra} -d ${POSTGRES_DB:-veyra}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  api:
    build:
      context: ../..
      dockerfile: deployments/docker/api.Dockerfile
    image: veyra-api:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: "8008"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-veyra}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-veyra}
      DB_NAME: ${POSTGRES_DB:-veyra}
      DB_SSLMODE: disable
    ports:
      - "8008:8008"
    healthcheck:
      # Use 127.0.0.1 — BusyBox wget does not fall back from ::1.
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:8008/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: ../..
      dockerfile: deployments/docker/worker.Dockerfile
    image: veyra-worker:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-veyra}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-veyra}
      DB_NAME: ${POSTGRES_DB:-veyra}
      DB_SSLMODE: disable
      VEYRA_WORKER_QUEUES: ${VEYRA_WORKER_QUEUES:-default}
      VEYRA_WORKER_FAILURE_PERCENT: ${VEYRA_WORKER_FAILURE_PERCENT:-20}
    stop_grace_period: 30s

volumes:
  veyra-postgres-data:
    driver: local
